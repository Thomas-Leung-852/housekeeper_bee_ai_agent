<svg width="780" height="580" viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Housekeeper Bee AI Agent Architecture</title>

  <!-- Background -->
  <rect width="780" height="580" fill="#f8f9fa"/>

  <!-- ══════════════════════════════════════════
       AGENT BOX (outer dashed border)
  ══════════════════════════════════════════ -->
  <rect x="200" y="60" width="380" height="280" rx="16"
        fill="#ffffff" stroke="#2d7d9a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="52" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="600" fill="#2d7d9a">Housekeeper Bee AI Agent</text>

  <!-- LLM inner box -->
  <rect x="230" y="80" width="320" height="80" rx="10"
        fill="#6d5fd4" stroke="#5248b0" stroke-width="1"/>
  <text x="390" y="112" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="14" font-weight="700" fill="#ffffff">Ollama LLM</text>
  <text x="390" y="132" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#d4cfff">Cloud model  or  Local model</text>
  <text x="390" y="150" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#d4cfff">Reasoning · Tool selection · ReAct loop</text>

  <!-- tools[] schema inner box -->
  <rect x="230" y="178" width="320" height="60" rx="10"
        fill="#1a5fa8" stroke="#124280" stroke-width="1"/>
  <text x="390" y="204" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="600" fill="#ffffff">tools[ ] schema</text>
  <text x="390" y="224" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#b8d8ff">16 tool definitions — hardcoded inside the app</text>

  <!-- Telegram Bot handler inner box -->
  <rect x="230" y="256" width="320" height="52" rx="10"
        fill="#0f7a5a" stroke="#0a5940" stroke-width="1"/>
  <text x="390" y="278" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="600" fill="#ffffff">Telegram Bot Handler</text>
  <text x="390" y="297" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#b4f0dc">Receive · Process · Reply</text>

  <!-- ══════════════════════════════════════════
       TELEGRAM LEFT (input)
  ══════════════════════════════════════════ -->
  <!-- Circle -->
  <circle cx="80" cy="200" r="40" fill="#229ED9"/>
  <!-- Telegram paper plane icon (simplified) -->
  <polygon points="60,185 102,200 60,215 65,200" fill="white" opacity="0.9"/>
  <polygon points="65,200 80,205 102,200" fill="white" opacity="0.7"/>

  <text x="80" y="254" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="12" font-weight="600" fill="#333">Telegram</text>
  <text x="80" y="270" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#555">Receive Message</text>

  <!-- Arrow: Telegram → Agent -->
  <line x1="122" y1="200" x2="196" y2="200" stroke="#444" stroke-width="2"/>
  <polygon points="196,196 206,200 196,204" fill="#444"/>

  <!-- ══════════════════════════════════════════
       TELEGRAM RIGHT (output)
  ══════════════════════════════════════════ -->
  <circle cx="700" cy="200" r="40" fill="#229ED9"/>
  <polygon points="680,185 722,200 680,215 685,200" fill="white" opacity="0.9"/>
  <polygon points="685,200 700,205 722,200" fill="white" opacity="0.7"/>

  <text x="700" y="254" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="12" font-weight="600" fill="#333">Telegram</text>
  <text x="700" y="270" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#555">Send Reply</text>

  <!-- Arrow: Agent → Telegram -->
  <line x1="584" y1="200" x2="656" y2="200" stroke="#444" stroke-width="2"/>
  <polygon points="656,196 666,200 656,204" fill="#444"/>

  <!-- ══════════════════════════════════════════
       BOTTOM ROW — external services
  ══════════════════════════════════════════ -->

  <!-- Redis -->
  <rect x="80" y="390" width="130" height="70" rx="10"
        fill="#cc2929" stroke="#9e1e1e" stroke-width="1"/>
  <text x="145" y="420" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">Redis</text>
  <text x="145" y="438" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#ffcccc">Short-term Memory</text>
  <text x="145" y="453" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="10" fill="#ffcccc">keyed by chatId</text>

  <!-- Two-way arrow: Agent ↔ Redis -->
  <line x1="280" y1="344" x2="180" y2="388" stroke="#cc2929" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="176,385 172,395 183,390" fill="#cc2929"/>
  <polygon points="284,347 278,337 274,348" fill="#cc2929"/>
  <text x="200" y="373" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="10" fill="#cc2929">load / save</text>

  <!-- Housekeeper Bee -->
  <rect x="295" y="390" width="190" height="70" rx="10"
        fill="#b07010" stroke="#8a5600" stroke-width="1"/>
  <text x="390" y="418" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">Housekeeper Bee</text>
  <text x="390" y="436" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#ffe9a0">REST API Server</text>
  <text x="390" y="452" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="10" fill="#ffe9a0">Storage boxes · Server status</text>

  <!-- Arrow: Agent ↔ Housekeeper Bee -->
  <line x1="390" y1="344" x2="390" y2="388" stroke="#b07010" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="386,388 390,398 394,388" fill="#b07010"/>
  <polygon points="386,344 390,334 394,344" fill="#b07010"/>
  <text x="420" y="372" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="10" fill="#b07010">fetch()</text>

  <!-- Zigbee / MQTT -->
  <rect x="568" y="390" width="160" height="70" rx="10"
        fill="#2d7d9a" stroke="#1a5a74" stroke-width="1"/>
  <text x="648" y="415" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">Zigbee / MQTT</text>
  <text x="648" y="433" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#c8eaf4">Fingerbot</text>
  <text x="648" y="450" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#c8eaf4">Temp &amp; Humidity Sensor</text>

  <!-- Arrow: Agent ↔ Zigbee -->
  <line x1="500" y1="344" x2="600" y2="388" stroke="#2d7d9a" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="596,385 606,390 598,380" fill="#2d7d9a"/>
  <polygon points="496,341 492,331 503,336" fill="#2d7d9a"/>
  <text x="572" y="373" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="10" fill="#2d7d9a">publish / subscribe</text>

  <!-- ══════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════ -->
  <rect x="30" y="500" width="720" height="56" rx="8"
        fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" font-weight="600" fill="#444">Legend:</text>

  <!-- dashed line sample -->
  <line x1="110" y1="516" x2="145" y2="516" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="145,513 152,516 145,519" fill="#666"/>
  <text x="158" y="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#444">fetch() / MQTT call to external service</text>

  <line x1="380" y1="516" x2="405" y2="516" stroke="#cc2929" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="400,513 407,516 400,519" fill="#cc2929"/>
  <polygon points="385,513 378,516 385,519" fill="#cc2929"/>
  <text x="416" y="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#444">two-way (read + write)</text>

  <rect x="110" y="530" width="12" height="12" rx="2" fill="#6d5fd4"/>
  <text x="128" y="541" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#444">LLM lives inside the agent (Ollama Native)</text>

  <rect x="380" y="530" width="12" height="12" rx="2" fill="#1a5fa8"/>
  <text x="398" y="541" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11" fill="#444">tools[] schema also inside — no middleware</text>

</svg>
